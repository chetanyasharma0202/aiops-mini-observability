global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: aiops-demo-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
  - job_name: 'node-exporter-local'
    scrape_interval: 15s
    static_configs:
      - targets: ['192.168.19.20:9100']
        labels:
          instance: 'local-vm'    
